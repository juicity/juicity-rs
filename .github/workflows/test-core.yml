# ============================================
# Juicity-RS Core Test Workflow
# ============================================
# Runs on push / pull_request when core paths change:
#   client / server / common (+ Cargo.toml / Cargo.lock / build scripts / CI)
# Orchestrates the reusable workflows:
#   1. build-package.yml — offline source packaging
#   2. build-core.yml    — core build & test (consumes the package artifact)
# ============================================

name: Test Core

on:
  push:
    branches:
      - master
    paths:
      - 'common/**'
      - 'client/**'
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.sh'
      - 'build.bat'
      - '.github/**'
  pull_request:
    paths:
      - 'common/**'
      - 'client/**'
      - 'server/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.sh'
      - 'build.bat'
      - '.github/**'

jobs:
  # --------------------------------------------------
  # Package Offline Source Code
  # --------------------------------------------------
  package:
    name: Package Offline Source Code
    uses: ./.github/workflows/build-package.yml
    secrets: inherit

  # --------------------------------------------------
  # Core build & test (client / server / common)
  # --------------------------------------------------
  test_core:
    name: Test Core
    needs: package
    uses: ./.github/workflows/build-core.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit

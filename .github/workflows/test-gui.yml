# ============================================
# Juicity-RS GUI Test Workflow
# ============================================
# Runs on push / pull_request when GUI-related paths change:
#   gui (+ its dependencies: common / client / server / Cargo files / CI)
# Orchestrates the reusable workflows:
#   1. build-package.yml — offline source packaging
#   2. build-gui.yml     — GUI build & test (consumes the package artifact)
# ============================================

name: Test GUI

on:
  push:
    branches:
      - master
    paths:
      - 'gui/**'
      - 'common/**'
      - 'client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/**'
  pull_request:
    paths:
      - 'gui/**'
      - 'common/**'
      - 'client/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/**'

jobs:
  # --------------------------------------------------
  # Package Offline Source Code
  # --------------------------------------------------
  package:
    name: Package Offline Source Code
    uses: ./.github/workflows/build-package.yml
    secrets: inherit

  # --------------------------------------------------
  # GUI build & test
  # --------------------------------------------------
  test_gui:
    name: Test GUI
    needs: package
    uses: ./.github/workflows/build-gui.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit

  slint:
    name: Slint (Linux)
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Download offline source
        uses: actions/download-artifact@v8
        with:
          name: juicity-offline-source
      - name: Extract offline source
        run: tar -xzf juicity-offline-source.tar.gz
      - name: Install Slint build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-core
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build and test Slint
        run: |
          cargo build --locked --frozen --offline -p juicity-gui --no-default-features --features ui-slint
          cargo test --locked --frozen --offline -p juicity-gui --no-default-features --features ui-slint
      - name: Render overview fixtures
        run: JUICITY_SHOTS=1 cargo test --locked --frozen --offline -p juicity-gui --no-default-features --features ui-slint shots -- --ignored --test-threads=1
      - name: Upload Slint screenshots
        uses: actions/upload-artifact@v7
        with:
          name: juicity-slint-shots
          path: target/juicity-shots/*.png
          if-no-files-found: error

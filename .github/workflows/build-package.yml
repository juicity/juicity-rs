# ============================================
# Juicity-RS Reusable Package Workflow
# ============================================
# Called via workflow_call from build-core.yml / build-gui.yml.
# Packages the offline source code (git archive + cargo vendor +
# .cargo/config.toml) into a single artifact for offline builds.
# ============================================

name: Build Package (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to check out (empty = default branch)
        type: string
        required: false
        default: ''

    outputs:
      revision:
        description: Exact source commit in the offline package
        value: ${{ jobs.package.outputs.revision }}

jobs:
  package:
    name: Package Offline Source Code
    runs-on: ubuntu-26.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout tag if provided
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git tag -l "${{ inputs.tag }}")" ]; then
            git tag ${{ inputs.tag }}
            git checkout ${{ inputs.tag }}
          else
            echo "Tag already exists, checking out existing tag."
            git checkout ${{ inputs.tag }}
          fi

      - name: Push new tag if created
        if: ${{ inputs.tag != '' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true

      - name: Record source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup vendor for offline build
        shell: bash
        run: |
          cargo vendor
          mkdir -p .cargo
          echo '[source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"' > .cargo/config.toml

      - name: Create offline source package
        shell: bash
        run: |
          # git archive (tracked source) + vendor/ + .cargo/config.toml
          git archive --format=tar -o juicity-offline-source.tar HEAD
          tar -rf juicity-offline-source.tar vendor/ .cargo/
          gzip -f juicity-offline-source.tar

      - name: Upload offline source artifact
        uses: actions/upload-artifact@v7
        with:
          name: juicity-offline-source
          path: juicity-offline-source.tar.gz

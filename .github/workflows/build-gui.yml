# ============================================
# Juicity-RS Reusable GUI Build Workflow
# ============================================
# Called via workflow_call from test-gui.yml / release.yml.
# The caller is responsible for running build-package.yml first
# (this workflow consumes the juicity-offline-source artifact).
# Builds the juicity-gui (Slint) app for Linux / Windows (x86_64 + aarch64,
# gnullvm + MSVC) / macOS.
# ============================================

name: Build GUI (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag baked into `--version` (empty = keep git-describe style)
        type: string
        required: false
        default: ''
      sha:
        description: Commit sha baked into `--version` (empty = auto-detect from git)
        type: string
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------
  # GUI native build matrix
  # --------------------------------------------------
  gui:
    name: GUI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      JUICITY_BUILD_TAG: ${{ inputs.tag }}
      JUICITY_BUILD_COMMIT: ${{ inputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            os: linux

          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux

          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-gnullvm
            toolchain: gnullvm
            msystem: CLANG64
            msystem_arch: clang-x86_64
            os: windows

          # Static MSVC build: no MSYS2 runtime DLLs to ship alongside.
          - name: windows-x86_64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            toolchain: msvc
            os: windows

          # Windows on ARM: built on the native ARM64 runner, with the same
          # CLANGARM64 toolchain the core workflow uses for this target.
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            toolchain: gnullvm
            msystem: CLANGARM64
            msystem_arch: clang-aarch64
            os: windows

          - name: windows-aarch64-msvc
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            toolchain: msvc
            os: windows

          - name: macos-x86_64
            runner: macos-26-intel
            target: x86_64-apple-darwin
            os: macos

          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            os: macos

    steps:
      - uses: actions/checkout@v7

      - name: Download offline source
        uses: actions/download-artifact@v8
        with:
          name: juicity-offline-source

      - name: Extract offline source
        shell: bash
        run: tar -xzf juicity-offline-source.tar.gz

      # ── Install dependencies ─────────────────────────────────────────────
      # Slint loads Wayland, X11 (libxcb), xkbcommon and OpenGL with dlopen at
      # runtime, so only the Fontconfig development files are needed to build.
      # The Noto fonts are used by the tests. macOS and Windows need no extra
      # packages.

      - name: Install Slint build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libfontconfig1-dev fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-core

      - name: Install Rust toolchain (Linux/macOS)
        if: matrix.os != 'windows'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Rust toolchain (Windows MSVC)
        if: matrix.toolchain == 'msvc'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup MSYS2 (Windows gnullvm)
        if: matrix.toolchain == 'gnullvm'
        uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-${{ matrix.msystem_arch }}-clang
            mingw-w64-${{ matrix.msystem_arch }}-lld
            mingw-w64-${{ matrix.msystem_arch }}-llvm
            mingw-w64-${{ matrix.msystem_arch }}-rust

      # ── Build ────────────────────────────────────────────────────────────

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows'
        run: cargo build --locked --frozen --offline  --workspace --release --target ${{ matrix.target }} --exclude juicity-server

      - name: Build (Windows gnullvm)
        if: matrix.toolchain == 'gnullvm'
        shell: msys2 {0}
        run: cargo build --locked --frozen --offline  --workspace --release --target ${{ matrix.target }} --exclude juicity-server

      - name: Build (Windows MSVC)
        if: matrix.toolchain == 'msvc'
        env:
          # -C target-feature=+crt-static links the static MSVC CRT (/MT), so
          # no VC++ runtime DLLs are needed at run time.
          RUSTFLAGS: -C target-feature=+crt-static
          # x86_64 assembly in aws-lc-sys is assembled with NASM, which the
          # runners do not ship; use the NASM objects bundled with the crate.
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: cargo build --locked --frozen --offline  --workspace --release --target ${{ matrix.target }} --exclude juicity-server

      # ── Test ────────────────────────────────────────────────────────────

      - name: Run tests (Linux/macOS)
        if: matrix.os != 'windows'
        run: cargo test --locked --frozen --offline  -p juicity-gui --target ${{ matrix.target }}

      - name: Run tests (Windows gnullvm, clear POSIX env vars to validate i18n fallback)
        if: matrix.toolchain == 'gnullvm'
        shell: msys2 {0}
        run: |
          unset LANG LC_ALL LC_MESSAGES
          cargo test --locked --frozen --offline  -p juicity-gui --target ${{ matrix.target }}

      - name: Run tests (Windows MSVC)
        if: matrix.toolchain == 'msvc'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: cargo test --locked --frozen --offline  -p juicity-gui --target ${{ matrix.target }}

      # ── Prepare package ───────────────────────────────────────────────────

      - name: Prepare package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          PKG_NAME="juicity-gui-${{ matrix.name }}"
          mkdir -p "${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/juicity-gui"    "${PKG_NAME}/"

      - name: Prepare .app bundle (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Derive version from the release tag (strip leading 'v');
          # fall back to 0.1.0 for branch/PR builds (e.g. the test workflow).
          VERSION="${RELEASE_TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="0.1.0"
          fi
          # Generate the .app bundle with all dependencies bundled inside
          bash gui/macos/bundle.sh \
            --target-dir "target/${{ matrix.target }}/release" \
            --app-name "Juicity" \
            --version "${VERSION}" \
            --build-number "${{ github.run_number }}"
          # The bundle.sh creates dist/Juicity.app
          # Rename to include target name for artifact naming
          mv dist/Juicity.app "dist/juicity-gui-${{ matrix.name }}.app"

      - name: Prepare package + collect DLLs (Windows gnullvm)
        if: matrix.toolchain == 'gnullvm'
        shell: msys2 {0}
        run: |
          PKG_NAME="juicity-gui-${{ matrix.name }}"
          PKG_DIR="$(pwd)/${PKG_NAME}"
          mkdir -p "${PKG_DIR}"

          # Copy built binaries
          cp "target/${{ matrix.target }}/release/juicity-gui.exe"    "${PKG_DIR}/"

          # Collect DLL dependencies recursively for all EXEs
          declare -A seen
          queue=("${PKG_DIR}/juicity-gui.exe")
          while [[ ${#queue[@]} -gt 0 ]]; do
            bin="${queue[0]}"; queue=("${queue[@]:1}")
            [[ -f "$bin" ]] || continue
            while IFS= read -r dll; do
              name=$(basename "$dll")
              [[ -n "${seen[$name]+x}" ]] && continue
              seen[$name]=1
              cp "$dll" "${PKG_DIR}/"
              queue+=("${PKG_DIR}/${name}")
            done < <(ldd "$bin" 2>/dev/null | awk '/=> \// {print $3}' | grep -v '/c/[Ww]indows')
          done

      # The MSVC build links the CRT statically, so no extra DLLs are needed.
      - name: Prepare package (Windows MSVC)
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $pkg = "juicity-gui-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/juicity-gui.exe"    $pkg

      # ── Upload artifact ───────────────────────────────────────────────────

      - name: Upload artifact (Linux/Windows)
        if: matrix.os != 'macos'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: juicity-gui-${{ matrix.name }}
          path: juicity-gui-${{ matrix.name }}
          if-no-files-found: error

      - name: Upload artifact (macOS .app bundle)
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: juicity-gui-${{ matrix.name }}.app
          path: dist/juicity-gui-${{ matrix.name }}.app
          if-no-files-found: error

# ============================================
# Juicity-RS Release Workflow
# ============================================
# Builds a selected existing tag, attaches release assets, then publishes tested images.
# Orchestrates the reusable workflows:
#   1. build-package.yml — offline source packaging (checked out at the tag)
#   2. build-core.yml    — core targets, with:
#        tag: the exact release tag (baked into `--version` output)
#        sha: the commit the release points to (baked into `--version` output)
#   3. build-gui.yml     — GUI targets (same tag / sha)
# Then attaches all artifacts to the Release.
# ============================================

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "The tag to release"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------
  # Package Offline Source Code (at the release tag)
  # --------------------------------------------------
  package:
    name: Package Offline Source Code
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets: inherit

  # --------------------------------------------------
  # Build every target via the core build workflow
  # --------------------------------------------------
  build-core:
    name: Build Core Targets
    needs: package
    uses: ./.github/workflows/build-core.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      sha: ${{ needs.package.outputs.revision }}
    secrets: inherit

  # --------------------------------------------------
  # Build every target via the GUI build workflow
  # --------------------------------------------------
  build-gui:
    name: Build GUI Targets
    needs: package
    uses: ./.github/workflows/build-gui.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      sha: ${{ needs.package.outputs.revision }}
    secrets: inherit

  # --------------------------------------------------
  # Attach all artifacts to the GitHub Release
  # --------------------------------------------------
  publish:
    name: Attach to Release
    needs: [build-core, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: juicity-*
          path: artifacts

      - name: Compress artifacts into zip files
        shell: bash
        run: |
          shopt -s globstar
          for dir in artifacts/*/; do
            target_name=$(basename "$dir")
            # The offline source package is already a .tar.gz — skip zipping
            [[ "$target_name" == "juicity-offline-source" ]] && continue
            zipfile="artifacts/${target_name}.zip"
            echo "Creating zip: $zipfile from $dir"
            (cd "$dir" && zip -ry "../../${zipfile}" .)
          done

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.zip \
            artifacts/juicity-offline-source/juicity-offline-source.tar.gz --clobber

  docker:
    name: Test Docker images
    needs: [package, build-core]
    uses: ./.github/workflows/docker.yml
    with:
      revision: ${{ needs.package.outputs.revision }}
      version: ${{ inputs.tag }}

  publish-docker:
    name: Publish tested images to GHCR
    needs: [package, docker, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.revision }}
      - name: Require a published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVISION: ${{ needs.package.outputs.revision }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > release.json
          jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and (.isDraft | not) and (.isPrerelease | not)' release.json
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "FETCH_HEAD^{commit}")" = "$REVISION"
          echo "image=ghcr.io/${GH_REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-image-*
          path: images
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture images and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          refs=()
          for arch in amd64 arm64 armv7; do
            docker load -i "images/docker-image-$arch/docker-image.tar"
            ref="$IMAGE:$RELEASE_TAG-$arch"
            docker tag juicity-container:test "$ref"
            docker push "$ref"
            refs+=("$ref")
          done
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "${refs[@]}"
          if [ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
          fi

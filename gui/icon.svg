<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background circular gradient: vibrant cyan-teal sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Kite panel gradients (gentle, elegant beige / cream palette) -->
    <!-- Top-left facet: soft pearl ivory -->
    <linearGradient id="facetTopLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#fef9ee" />
    </linearGradient>

    <!-- Top-right facet: pale warm beige -->
    <linearGradient id="facetTopRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef6e4" />
      <stop offset="100%" stop-color="#f9ebd2" />
    </linearGradient>

    <!-- Bottom-left facet: soft oat milk beige -->
    <linearGradient id="facetBottomLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef6e4" />
      <stop offset="100%" stop-color="#f3dfbf" />
    </linearGradient>

    <!-- Bottom-right facet: warm light latte / camel shading -->
    <linearGradient id="facetBottomRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eed5b0" />
      <stop offset="100%" stop-color="#dfbe90" />
    </linearGradient>

    <!-- Soft 3D drop shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#034d65" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Circular background with clean white border -->
  <circle cx="60" cy="60" r="54.5" fill="url(#skyGrad)" stroke="#ffffff" stroke-width="3" />
  <circle cx="60" cy="60" r="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" />

  <!-- Kite & String structure -->
  <g filter="url(#shadow)">
    <!-- Kite Body (Positioned elegantly in upper center-right, tilted at 18 degrees) -->
    <g transform="translate(67, 43) rotate(18)">
      <!-- 4 diamond facets -->
      <polygon points="0,-28 -20,-4 0,0" fill="url(#facetTopLeft)" />
      <polygon points="0,-28 0,0 20,-4" fill="url(#facetTopRight)" />
      <polygon points="-20,-4 0,0 0,30" fill="url(#facetBottomLeft)" />
      <polygon points="0,0 20,-4 0,30" fill="url(#facetBottomRight)" />

      <!-- Spars (wooden/carbon cross struts) -->
      <line x1="0" y1="-28" x2="0" y2="30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <line x1="-20" y1="-4" x2="20" y2="-4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

      <!-- Subtle inner edge seam & rim -->
      <polygon points="0,-28 20,-4 0,30 -20,-4" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.9" />

      <!-- Corner reinforcement caps -->
      <circle cx="0" cy="-28" r="1.3" fill="#ffffff" />
      <circle cx="20" cy="-4" r="1.3" fill="#ffffff" />
      <circle cx="-20" cy="-4" r="1.3" fill="#ffffff" />
      <circle cx="0" cy="30" r="1.4" fill="#ffffff" />

      <!-- Flowing curly kite tail (smooth wave, contained inside disc) -->
      <path d="M 0,30 C 5,38 1,45 5,53 C 8,59 4,64 1,67" fill="none" stroke="#fbf4e8" stroke-width="1.6" stroke-linecap="round" />

      <!-- Decorative bows / ribbons along the tail -->
      <!-- Bow 1 -->
      <path d="M 1,36 L -3,34 L -2,38 Z M 1,36 L 5,34 L 4,38 Z" fill="#fffdf9" />
      <circle cx="1" cy="36" r="0.8" fill="#f0dbbe" />
      <!-- Bow 2 -->
      <path d="M 3,45 L -1,43 L 0,47 Z M 3,45 L 7,43 L 6,47 Z" fill="#f5e4cb" />
      <circle cx="3" cy="45" r="0.8" fill="#fffdf9" />
      <!-- Bow 3 -->
      <path d="M 5.5,54 L 1.5,52 L 2.5,56 Z M 5.5,54 L 9.5,52 L 8.5,56 Z" fill="#fffdf9" />
      <circle cx="5.5" cy="54" r="0.8" fill="#f0dbbe" />
      <!-- Bow 4 -->
      <path d="M 2.5,63 L -1.5,61 L -0.5,65 Z M 2.5,63 L 6.5,61 L 5.5,65 Z" fill="#f5e4cb" />
      <circle cx="2.5" cy="63" r="0.8" fill="#fffdf9" />
    </g>

    <!-- Unified curved kite string: tethered at the cross center (67, 43), graceful arc down to (26, 96) -->
    <path d="M 67 43 C 50 56 36 74 26 96" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- Small knot / bead at the center tether point -->
    <circle cx="67" cy="43" r="1.2" fill="#ffffff" />
  </g>

  <!-- Whimsical breeze / sparkling wind particles -->
  <g fill="#ffffff">
    <circle cx="24" cy="42" r="1.6" opacity="0.75" />
    <circle cx="18" cy="52" r="1.1" opacity="0.55" />
    <circle cx="34" cy="33" r="1.4" opacity="0.8" />
    <circle cx="91" cy="20" r="1.6" opacity="0.65" />
    <circle cx="100" cy="32" r="1.1" opacity="0.5" />
    <circle cx="40" cy="88" r="1.3" opacity="0.55" />
    <circle cx="30" cy="78" r="1" opacity="0.45" />
  </g>
</svg>

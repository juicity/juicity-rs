[package]
name = "juicity-gui"
version.workspace = true
edition.workspace = true

[dependencies]
juicity-common = { path = "../common" }
# Embedded proxy core (QUIC client + local SOCKS5/HTTP server).
juicity-client = { path = "../client" }
# Official shadowsocks-rust library, used for the Shadowsocks protocol.
shadowsocks-service = { workspace = true }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
url.workspace = true
base64.workspace = true
ureq = "2.9"

slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "accessibility", "unstable-fontique-011", "unstable-winit-030"] }
# Clipboard and local time for the Slint UI; both are already in the lockfile via Slint.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5"
notify = "7"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# Single instance for the Slint UI (D-Bus name + org.freedesktop.Application);
# the same version ksni already uses.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Writes the autostart entry under the Run registry key.
windows-registry = "0.5"
# Single instance for the Slint UI: named mutex, named pipe, foreground rights.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Builds Slint's winit backend without its default menu bar, whose Quit
# bypasses the save prompt; same version as `slint`.
i-slint-backend-winit = { version = "=1.18.1", default-features = false, features = ["muda"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
resvg = "0.44"
slint-build = "=1.18.1"
# Compiles the generated `icon.ico` into the Windows executable's resources.
embed-resource = "3"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
image = { version = "0.25", default-features = false, features = ["png"] }
